global:
  scrape_interval: 5s

scrape_configs:
  - job_name: fleettrack
    metrics_path: /actuator/prometheus
    static_configs:
      # app started from IntelliJ on your machine
      - targets: ["host.docker.internal:8080"]
        labels: { source: host }
      # app started with `docker compose --profile app up`
      - targets: ["app:8080"]
        labels: { source: compose }
