# DEV / DEMO ONLY (kind, minikube, Docker Desktop Kubernetes): single-replica, no persistence.
# In production use managed services (RDS/Cloud SQL with PostGIS, MSK/Confluent, ElastiCache)
# or proper operators/Helm charts.
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: fleettrack }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:16-3.4
          env:
            - { name: POSTGRES_DB, value: fleettrack }
            - { name: POSTGRES_USER, value: fleettrack }
            - { name: POSTGRES_PASSWORD, value: fleettrack }
          ports: [ { containerPort: 5432 } ]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "fleettrack", "-d", "fleettrack"] }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: fleettrack }
spec:
  selector: { app: postgres }
  ports: [ { port: 5432 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: fleettrack }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [ { containerPort: 6379 } ]
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: fleettrack }
spec:
  selector: { app: redis }
  ports: [ { port: 6379 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kafka, namespace: fleettrack }
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      enableServiceLinks: false   # avoid KAFKA_* env vars injected from the "kafka" Service
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
          ports: [ { containerPort: 9092 } ]
---
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: fleettrack }
spec:
  selector: { app: kafka }
  ports: [ { port: 9092 } ]
