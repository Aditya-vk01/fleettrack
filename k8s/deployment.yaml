apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleettrack
  namespace: fleettrack
  labels:
    app: fleettrack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fleettrack
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: fleettrack
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: fleettrack
          # CI pushes ghcr.io/<owner>/fleettrack:<git-sha>; the deploy job pins this to the sha.
          image: ghcr.io/OWNER/fleettrack:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: fleettrack-config
            - secretRef:
                name: fleettrack-db
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
          # Gives the JVM up to ~2.5 min to boot before liveness checks start counting.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          # Liveness = "is the process wedged?" Restart the pod if it fails.
          # Deliberately excludes the DB/Redis: a database outage must not restart every pod.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Readiness = "should this pod get traffic?" Includes DB and Redis; a failing pod
          # is taken out of the Service's endpoints, not restarted.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            # Let the Service stop routing to this pod before Spring starts its graceful shutdown.
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
