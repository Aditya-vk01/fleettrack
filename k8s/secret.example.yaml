# Example only. Don't commit real credentials - create the secret out of band:
#   kubectl -n fleettrack create secret generic fleettrack-db \
#     --from-literal=DB_USERNAME=fleettrack --from-literal=DB_PASSWORD='<password>'
apiVersion: v1
kind: Secret
metadata:
  name: fleettrack-db
  namespace: fleettrack
type: Opaque
stringData:
  DB_USERNAME: fleettrack
  DB_PASSWORD: fleettrack
