spring:
  application:
    name: fleettrack

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fleettrack}
    username: ${DB_USERNAME:fleettrack}
    password: ${DB_PASSWORD:fleettrack}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it,
      # so schema drift fails at startup instead of at runtime.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        # Don't hold an HTTP request thread for 60s if the broker is down.
        max.block.ms: 3000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        # Liveness only answers "is this JVM wedged?" - never include external deps,
        # or a database blip makes Kubernetes restart every pod at once.
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        fleettrack.location.pipeline.lag: true

fleettrack:
  kafka:
    topics:
      courier-locations: courier-locations
      delivery-events: delivery-events
    partitions: 6
    replicas: 1
  assignment:
    default-radius-meters: 5000
  eta:
    average-speed-kmh: 25
    ttl-minutes: 15
  notifications:
    arriving-soon-meters: 300

logging:
  level:
    com.fleettrack: INFO
